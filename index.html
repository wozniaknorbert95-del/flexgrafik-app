<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#ff00ff" />
    <meta name="description" content="AI-powered accountability system for entrepreneurs" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexGrafik" />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎯</text></svg>"
    />
    <title>FlexGrafik OS</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #050505;
        color: #e5e7eb;
        -webkit-tap-highlight-color: transparent;
      }
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 2px;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
        }
      }
    </script>
  </head>
  <body class="pb-safe">
    <div id="app" class="min-h-screen relative"></div>
    <!-- Hidden div to ensure Tailwind includes critical classes -->
    <div
      class="hidden bg-gradient-to-r from-pink-600 to-fuchsia-600 border-cyan-500 text-cyan-400 shadow-[0_0_20px_rgba(255,0,128,0.5)]"
    ></div>

    <script>
      // Clear any existing vanilla JS app before React takes over
      if (window.App) {
        delete window.App;
      }
      // Clear the app container to prevent conflicts
      const appContainer = document.getElementById('app');
      if (appContainer) {
        appContainer.innerHTML = '';
      }

      // ============================================================
      // SERVICE WORKER REGISTRATION (PWA)
      // ============================================================
      // IMPORTANT (stability): In dev (localhost) we skip SW registration to avoid stale caches
      // causing "UI doesn't match code" confusion.
      const isDevHost =
        location.hostname === 'localhost' ||
        location.hostname === '127.0.0.1' ||
        location.hostname === '::1';

      if ('serviceWorker' in navigator && !isDevHost) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('✅ Service Worker registered:', registration.scope);

              // Check for updates every hour
              setInterval(
                () => {
                  registration.update();
                },
                60 * 60 * 1000
              );

              // Stable update UX:
              // - prompt only when an update is WAITING and there's an existing controller
              // - do NOT reload immediately; wait for controllerchange to reload once
              let updatePrompted = false;

              const maybePromptUpdate = () => {
                if (updatePrompted) return;
                if (!navigator.serviceWorker.controller) return;
                if (!registration.waiting) return;

                updatePrompted = true;
                console.log('✨ New Service Worker waiting - prompt to update');

                if (confirm('New version available! Reload to update?')) {
                  registration.waiting.postMessage({ type: 'SKIP_WAITING' });
                } else {
                  // Allow future prompt (e.g. manual refresh later)
                  updatePrompted = false;
                }
              };

              // If an update is already waiting at load, prompt immediately
              maybePromptUpdate();

              // Listen for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (!newWorker) return;
                console.log('🔄 Service Worker update found');

                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed') {
                    // If this is an update (controller exists), it will become waiting
                    maybePromptUpdate();
                  }
                });
              });
            })
            .catch((error) => {
              console.error('❌ Service Worker registration failed:', error);
            });

          // Reload page when new SW takes control
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (refreshing) return;
            refreshing = true;
            console.log('🔄 New Service Worker activated');
            window.location.reload();
          });
        });
      } else {
        if (!('serviceWorker' in navigator)) {
          console.warn('⚠️ Service Workers not supported in this browser');
        } else if (isDevHost) {
          console.log('🧪 Dev mode: Service Worker registration skipped (localhost)');
        }
      }

      // ============================================================
      // INSTALL PROMPT (A2HS - Add to Home Screen)
      // ============================================================
      let deferredPrompt;

      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('💾 Install prompt available');
        e.preventDefault();
        deferredPrompt = e;

        // Optional: Show custom install button
        // showInstallButton();
      });

      window.addEventListener('appinstalled', () => {
        console.log('✅ PWA installed successfully');
        deferredPrompt = null;
      });

      // Function to trigger install prompt (call from UI button)
      window.triggerInstallPrompt = async () => {
        if (!deferredPrompt) {
          console.log('Install prompt not available');
          return;
        }

        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log(`Install prompt outcome: ${outcome}`);
        deferredPrompt = null;
      };

      // ============================================================
      // OFFLINE/ONLINE DETECTION
      // ============================================================
      window.addEventListener('online', () => {
        console.log('🌐 Connection restored');
        // Optional: Show notification or sync data
      });

      window.addEventListener('offline', () => {
        console.log('📡 Connection lost - running offline');
        // Optional: Show offline indicator
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
